<svg width="140" height="40" viewBox="0 0 140 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Diamond shape (rotated square) -->
  <g transform="translate(0, 0)">
    <rect x="20" y="0" width="28" height="28" rx="4" transform="rotate(45 20 14)" fill="#1a1a4e"/>
    <!-- White diagonal lines -->
    <line x1="6" y1="22" x2="22" y2="6" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="26" x2="26" y2="10" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="30" x2="30" y2="14" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="34" x2="34" y2="18" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Text "fapps" -->
  <text x="48" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1a1a4e">fapps</text>
</svg>
