<svg width="200" height="50" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Diamond shape -->
  <g transform="translate(5, 5)">
    <rect width="40" height="40" rx="6" transform="rotate(45 20 20)" fill="#1a1a4e"/>
    <!-- White lines inside diamond -->
    <line x1="8" y1="28" x2="28" y2="8" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="32" y2="12" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="36" x2="36" y2="16" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="40" x2="40" y2="20" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Text "fapps" -->
  <text x="60" y="35" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1a1a4e">fapps</text>
</svg>
